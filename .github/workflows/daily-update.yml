name: Update Daily Commit Dashboard

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Run Dashboard Generator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: "Asia/Seoul"
        run: python update_dashboard.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md dashboard_state.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update daily commit dashboard"

          # 원격에 새 커밋이 있으면 rebase. README는 봇이 재생성하므로 봇 버전(--theirs) 유지
          for i in 1 2 3; do
            if ! git pull --rebase origin main; then
              git checkout --theirs -- README.md dashboard_state.json
              git add README.md dashboard_state.json
              GIT_EDITOR=true git rebase --continue
            fi
            if git push origin main; then
              exit 0
            fi
            sleep 2
          done
          echo "Failed to push after retries"
          exit 1